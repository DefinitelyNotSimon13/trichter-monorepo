spring:
  profiles:
    default: local
  application:
    name: trichter-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BETTERAUTH_URL}
          jwk-set-uri: ${BETTERAUTH_URL}/.well-known/jwks.json
          jws-algorithms:
            - ES512
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  build-id: "@buildId@"
  device:
    secret: ${DEVICE_SECRET:dev-secret}
  storage:
    azure:
      container-name: trichter-image
      key-prefix: runs/images
  cors:
    allowed-origins: "https://next.trichter.hauptspeicher.com"

springdoc:
  swagger-ui:
    path: /api/v2/docs
  api-docs:
    path: /api/v2/api-docs
  show-actuator: true

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.springframework.security: warn
    org.springframework.security.oauth2: warn
    org.springframework.web.cors: warn

