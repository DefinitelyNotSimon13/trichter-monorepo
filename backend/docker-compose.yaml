services:
  postgres:
    image: postgres:18
    container_name: postgres-trichter-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: trichter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
