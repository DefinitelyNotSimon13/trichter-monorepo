apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trichter-backend
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trichter-backend.json: |-
    {
      "uid": "trichter-backend",
      "title": "Trichter Backend",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "API Targets Up",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(up{namespace=\"trichter\", service=\"api\"})", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests",
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"trichter\"}[5m])) by (method, status)", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "JVM Memory Used",
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 0 },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{namespace=\"trichter\"}) by (area)", "refId": "A" }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trichter-uptime
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trichter-uptime.json: |-
    {
      "uid": "trichter-uptime",
      "title": "Trichter Uptime",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "Probe Success",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            { "expr": "avg by (instance) (probe_success{namespace=\"monitoring\"})", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Probe Duration",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 0 },
          "targets": [
            { "expr": "probe_duration_seconds{namespace=\"monitoring\"}", "refId": "A" }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trichter-azure
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trichter-azure.json: |-
    {
      "uid": "trichter-azure",
      "title": "Trichter Azure",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Postgres CPU / Memory / Storage %",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "azure_metric_postgres_cpu_percent_average_percent", "refId": "A" },
            { "expr": "azure_metric_postgres_memory_percent_average_percent", "refId": "B" },
            { "expr": "azure_metric_postgres_storage_percent_average_percent", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Postgres Connections",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "azure_metric_postgres_active_connections_average_count", "refId": "A" },
            { "expr": "azure_metric_postgres_connections_failed_total_count", "refId": "B" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Storage Traffic",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "azure_metric_storage_ingress_total_bytes", "refId": "A" },
            { "expr": "azure_metric_storage_egress_total_bytes", "refId": "B" },
            { "expr": "azure_metric_storage_transactions_total_count", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Blob Capacity",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "azure_metric_blob_blobcapacity_average_bytes", "refId": "A" }
          ]
        }
      ]
    }
