apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: azure-metrics-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-metrics-exporter
        app.kubernetes.io/part-of: monitoring
    spec:
      containers:
        - name: azure-metrics-exporter
          image: webdevops/azure-metrics-exporter:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: AZURE_SUBSCRIPTION_ID
            - name: ENABLE_CACHING
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: azure-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: azure-metrics-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    app.kubernetes.io/name: azure-metrics-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: azure-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: azure-metrics-exporter
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-metrics-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
