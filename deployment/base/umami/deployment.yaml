apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: docker.umami.is/umami-software/umami:postgresql-latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-secret
                  key: DATABASE_URL

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-secret
                  key: APP_SECRET
