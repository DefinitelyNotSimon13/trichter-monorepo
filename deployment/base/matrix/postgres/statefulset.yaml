apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: matrix
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: matrix
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: matrix
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:18-alpine
          env:
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
            - name: POSTGRES_DB
              value: synapse
          envFrom:
            - secretRef:
                name: matrix-secret
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
