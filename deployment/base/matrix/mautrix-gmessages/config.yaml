apiVersion: v1
kind: ConfigMap
metadata:
  name: mautrix-gmessages-config-template
  namespace: matrix
data:
  config.template.yaml: |
    network:
        username_template: gmessages_{{.}}
        displayname_template: '{{or .FullName .PhoneNumber "Unknown"}} (GM)'
        sandbox: false
        proxy: null
        get_proxy_url: null

    bridge:
        command_prefix: '!gm'
        personal_filtering_spaces: true
        private_chat_portal_meta: true
        async_events: false
        resend_bridge_info: false
        bridge_status_notices: errors
        bridge_matrix_leave: false
        bridge_notices: false
        tag_only_on_create: true
        only_bridge_tags: [m.favourite, m.lowpriority]
        mute_only_on_create: true
        deduplicate_matrix_messages: false
        relay:
            enabled: false
            admin_only: true
        permissions:
            "*": relay
            "hauptspeicher.com": user
            "@simon:hauptspeicher.com": admin

    database:
        type: postgres
        uri: postgres://synapse:__POSTGRES_PASSWORD__@postgres.matrix.svc.cluster.local/mautrix_gmessages?sslmode=disable
        max_open_conns: 5
        max_idle_conns: 1
        max_conn_idle_time: null
        max_conn_lifetime: null

    homeserver:
        address: http://synapse.matrix.svc.cluster.local:8008
        domain: hauptspeicher.com
        software: standard
        async_media: true

    appservice:
        address: http://mautrix-gmessages.matrix.svc.cluster.local:29320
        hostname: 0.0.0.0
        port: 29320
        id: gmessages
        bot:
            username: gmessagesbot
            displayname: Google Messages Bot
            avatar: mxc://maunium.net/yGSfBBxXbkJLoGRqDRiNKsRF
        ephemeral_events: true
        async_transactions: false
        as_token: __GM_AS_TOKEN__
        hs_token: __GM_HS_TOKEN__
        username_template: gmessages_{{.}}

    matrix:
        message_status_events: true
        delivery_receipts: false
        message_error_notices: true
        sync_direct_chat_list: true
        federate_rooms: true
        upload_file_threshold: 5242880

    provisioning:
        shared_secret: disable
        debug_endpoints: false

    backfill:
        enabled: true
        max_initial_messages: 50
        max_catchup_messages: 500
        unread_hours_threshold: 720
        queue:
            enabled: false
            batch_size: 100
            batch_delay: 20
            max_batches: -1
