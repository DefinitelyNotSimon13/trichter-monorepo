apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-whatsapp
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: mautrix-whatsapp
    app.kubernetes.io/part-of: matrix
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mautrix-whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautrix-whatsapp
        app.kubernetes.io/part-of: matrix
        app.kubernetes.io/component: bridge
    spec:
      initContainers:
        - name: create-database
          image: docker.io/postgres:18-alpine
          envFrom:
            - secretRef:
                name: matrix-secret
          command:
            - sh
            - -c
            - |
              psql -h postgres.matrix.svc.cluster.local -U "$POSTGRES_USER" \
                -c "CREATE DATABASE mautrix_whatsapp ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;" \
                2>/dev/null || true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-secret
                  key: POSTGRES_PASSWORD
        - name: render-config
          image: alpine:3.23.4
          envFrom:
            - secretRef:
                name: matrix-secret
            - secretRef:
                name: whatsapp-bridge-secret
          command:
            - sh
            - -c
            - |
              set -eu
              # Always render registration.yaml so the startup script doesn't
              # regenerate it with different tokens than Synapse knows about.
              sed \
                -e "s|__WA_AS_TOKEN__|${WA_AS_TOKEN}|g" \
                -e "s|__WA_HS_TOKEN__|${WA_HS_TOKEN}|g" \
                /registration-template/whatsapp-registration.template.yaml > /data/registration.yaml
              # Always render config.yaml from the template.
              sed \
                -e "s|__POSTGRES_PASSWORD__|${POSTGRES_PASSWORD}|g" \
                -e "s|__WA_AS_TOKEN__|${WA_AS_TOKEN}|g" \
                -e "s|__WA_HS_TOKEN__|${WA_HS_TOKEN}|g" \
                -e "s|__DOUBLEPUPPET_AS_TOKEN__|${DOUBLEPUPPET_AS_TOKEN}|g" \
                /config-template/config.template.yaml > /data/config.yaml
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: registration-template
              mountPath: /registration-template
              readOnly: true
      containers:
        - name: mautrix-whatsapp
          image: dock.mau.dev/mautrix/whatsapp:latest
          ports:
            - name: http
              containerPort: 29318
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /_matrix/mau/live
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /_matrix/mau/ready
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-whatsapp
        - name: config-template
          configMap:
            name: mautrix-whatsapp-config-template
        - name: registration-template
          configMap:
            name: mautrix-whatsapp-registration-template
