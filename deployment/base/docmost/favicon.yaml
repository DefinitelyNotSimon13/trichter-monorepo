apiVersion: v1
kind: ConfigMap
metadata:
  name: docmost-nginx-config
  namespace: docmost
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        location / {
            try_files $uri =404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docmost-favicons
  namespace: docmost
binaryData:
  favicon.ico: 
  favicon-32x32.png: 
  favicon-16x16.png: 
  apple-touch-icon.png: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost-favicon
  namespace: docmost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docmost-favicon
  template:
    metadata:
      labels:
        app: docmost-favicon
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: favicons
              mountPath: /usr/share/nginx/html/icons
      volumes:
        - name: nginx-config
          configMap:
            name: docmost-nginx-config
        - name: favicons
          configMap:
            name: docmost-favicons
---
apiVersion: v1
kind: Service
metadata:
  name: docmost-favicon
  namespace: docmost
spec:
  selector:
    app: docmost-favicon
  ports:
    - name: http
      port: 80
      targetPort: 80
