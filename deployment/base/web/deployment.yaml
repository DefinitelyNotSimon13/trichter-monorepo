apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: trichter
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: trichter
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: trichter
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/definitelynotsimon13/trichter-monorepo/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: web-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      restartPolicy: Always
