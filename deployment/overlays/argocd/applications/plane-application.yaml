apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.plane.so/
      chart: plane-ce
      targetRevision: 1.5.0
      helm:
        releaseName: plane-app
        values: |
          planeVersion: v1.2.3

          ingress:
            enabled: false
            appHost: plane.hauptspeicher.com
            ingressClass: traefik

          postgres:
            storageClass: local-path

          redis:
            storageClass: local-path

          minio:
            storageClass: local-path

          rabbitmq:
            storageClass: local-path
    - repoURL: https://github.com/DefinitelyNotSimon13/trichter-monorepo.git
      targetRevision: HEAD
      path: deployment/overlays/plane
  destination:
    server: https://46.224.19.10:6443
    namespace: plane-ce
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
