apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fundus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/DefinitelyNotSimon13/trichter-monorepo.git
      targetRevision: HEAD
      path: deployment/overlays/apps/fundus
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      enabled: true
      prune: true
      selfHeal: true
