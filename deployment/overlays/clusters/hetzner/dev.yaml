---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-static
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-static
  template:
    metadata:
      labels:
        app: dev-static
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/DBbPv1
              subPath: DBbPv1
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: dbbpv1-html
---
apiVersion: v1
kind: Service
metadata:
  name: dev-static
  namespace: dev
spec:
  selector:
    app: dev-static
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dev-static
  namespace: dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dev.hauptspeicher.com`) && Path(`/DBbPv1`)
      kind: Rule
      services:
        - name: dev-static
          port: 80
  tls:
    certResolver: myresolver
