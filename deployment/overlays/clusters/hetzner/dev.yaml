      <p class="title">Distributed Blackboard Protocol (DBbP) Version 1<br />
      <span class="filename">draft-dbbp-v1-00</span></p>
      
      <h1 id="rfc.abstract"><a href="#rfc.abstract">Abstract</a></h1>
    <p>This document specifies version 1 of the Distributed Blackboard Protocol (DBbP), a TCP-based client/server protocol for managing named blackboards.</p>
    <p>A DBbP server stores multiple blackboards. Each blackboard stores at most one current message. A successful write replaces the previous message. A message can become invalid after a configurable lifetime, but expired messages remain stored until they are overwritten, cleared, or deleted.</p>
