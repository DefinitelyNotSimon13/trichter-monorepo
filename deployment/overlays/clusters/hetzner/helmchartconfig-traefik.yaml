apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.trichter.hauptspeicher.com`)
        entryPoints:
          - websecure
        middlewares:
          - name: auth
        tls:
          certResolver: myresolver
    ports:
      smtp:
        port: 25
        exposedPort: 25
        protocol: TCP
    certificatesResolvers:
      myresolver:
        acme:
          email: simon21.blum@gmail.com
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
